version: "3.8"

services:
  mongo:
    image: mongo:7.0
    ports:
    - 27018:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwerty

  mongo-express:
    image: mongo-express
    ports:
    - 8081:8081
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
      ME_CONFIG_MONGODB_URL: "mongodb://admin:qwerty@mongo:27017/?authSource=admin"

  testapp:
    image: testapp:1.0
    ports:
    - 5050:5050
    environment:
      MONGO_URL: "mongodb://admin:qwerty@mongo:27017/?authSource=admin"
